  {g:'Actions',t:'Create album from selection',ic:'plus',hint:'Ctrl N',run:()=>toast(SEL.size?`New album · ${SEL.size} items`:'Select photos first · drag on empty space to lasso')},
  {g:'Actions',t:'Find duplicates & blurry shots',ic:'spark',hint:'Cleanup',run:()=>go('cleanup')},
  {g:'Actions',t:'Add folder to library…',ic:'folder',run:()=>toast('Native folder picker · indexed in background, live-watched')},
  {g:'Actions',t:'Slideshow · whole library',ic:'slides',hint:'P',run:()=>openShow(FLAT,{label:'Library'})},
  {g:'Actions',t:'Slideshow · Iceland, cut to the beat',ic:'slides',hint:'♪ soundtrack',run:()=>openShow(sk('aug26').items,{label:'Iceland',tempo:'beat'})},
  {g:'Actions',t:'Play memory · Kyoto',ic:'play',run:()=>openReel(SECTIONS[0])},
  {g:'Jump to',t:'Trip · Iceland Ring Road',ic:'pin',run:()=>{go('library');setTimeout(()=>scrollSec('aug26'),120)}},
  {g:'Jump to',t:'Trip · Lisbon',ic:'pin',run:()=>{go('library');setTimeout(()=>scrollSec('sep26'),120)}},
  {g:'Jump to',t:'Albums',ic:'layers',hint:'2',run:()=>go('albums')},
  {g:'Jump to',t:'People constellation',ic:'users',hint:'3',run:()=>go('people')}
];
const PAL={wrap:$('#pal-wrap'),input:$('#pal-input'),list:$('#pal-list'),items:[],i:0};
function openPal(){PAL.wrap.classList.add('open');PAL.input.value='';renderPal();setTimeout(()=>PAL.input.focus(),30)}
function closePal(){PAL.wrap.classList.remove('open');PAL.input.blur()}
function renderPal(){
  const raw=PAL.input.value.trim(),q=raw.toLowerCase();
  const items=CMDS.filter(c=>!q||(c.t+' '+c.g+' '+(c.hint||'')).toLowerCase().includes(q));
  if(q)items.unshift({g:'Ask Sitara',t:`“${raw}”`,ic:'search',hint:'natural-language search',ask:1,run:()=>askSearch(raw)});
  PAL.items=items;PAL.i=0;let g='',h='';
  items.forEach((c,i)=>{if(c.g!==g){g=c.g;h+=`<div class="pal-g">${g}</div>`}h+=`<div class="pal-i${i?'':' on'}${c.ask?' ask':''}" data-i="${i}">${ic(c.ic,16)}<span class="t">${esc(c.t)}</span>${c.hint?`<span class="hint">${esc(c.hint)}</span>`:''}</div>`});
  PAL.list.innerHTML=h||'<div class="pal-g">No matches</div>';
}
function palActive(i){PAL.i=Math.max(0,Math.min(PAL.items.length-1,i));$$('.pal-i',PAL.list).forEach(el=>el.classList.toggle('on',+el.dataset.i===PAL.i));$('.pal-i.on',PAL.list)?.scrollIntoView({block:'nearest'})}
function palRun(i){const c=PAL.items[i];if(!c)return;closePal();setTimeout(c.run,140)}
PAL.input.addEventListener('input',renderPal);
PAL.list.addEventListener('pointermove',e=>{const el=e.target.closest('.pal-i');if(el&&+el.dataset.i!==PAL.i)palActive(+el.dataset.i)});
PAL.list.addEventListener('click',e=>{const el=e.target.closest('.pal-i');if(el)palRun(+el.dataset.i)});
PAL.wrap.addEventListener('click',e=>{if(e.target===PAL.wrap)closePal()});
$('#search').onclick=openPal;

/* rotating search hints */
const HINTS=['Search “red umbrella in the rain”','Search “Maya’s birthday, 2023”','Search “sunsets in Goa”','Try “photos taken on a Fujifilm”','Try “videos longer than 1 minute”'];
let hi=0;const ph=$('#ph');ph.textContent=HINTS[0];
setInterval(()=>{if(reduce)return;ph.classList.add('out');setTimeout(()=>{hi=(hi+1)%HINTS.length;ph.textContent=HINTS[hi];ph.classList.remove('out')},350)},3600);

/* indexing pill */
(function(){
  const from=12408,to=48210,t0=performance.now(),D=9000,pr=$('#ingest .pr'),tx=$('#ingest-t');
  const f=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3),n=Math.round(from+(to-from)*e);
    pr.style.strokeDashoffset=(44*(1-(n/to))).toFixed(2);
    if(k<1){tx.textContent=`Indexing · ${n.toLocaleString()} / ${to.toLocaleString()}`;requestAnimationFrame(f)}
    else{tx.textContent=`Up to date · ${to.toLocaleString()} items`;$('#ingest').classList.add('done')}};
  requestAnimationFrame(f);
  $('#ingest').onclick=()=>toast('Watching 3 folders · Pictures, D:\\Phone backup, E:\\Archive');
})();

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  const k=e.key;
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='k'){e.preventDefault();PAL.wrap.classList.contains('open')?closePal():openPal();return}
  if(PAL.wrap.classList.contains('open')){
    if(k==='Escape')closePal();else if(k==='ArrowDown'){e.preventDefault();palActive(PAL.i+1)}else if(k==='ArrowUp'){e.preventDefault();palActive(PAL.i-1)}else if(k==='Enter'){e.preventDefault();palRun(PAL.i)}
    return;
  }
  if(SS.el.classList.contains('open')){
    wake();
    if(k==='Escape'){SS.panel.classList.contains('on')?togglePanel(false):closeShow()}
    else if(k===' '||k==='p'||k==='P'||k==='k'||k==='K'){e.preventDefault();setPlay(!SS.playing);flash(SS.playing?'play':'pause')}
    else if(k==='ArrowRight'){e.preventDefault();goSlide(SS.i+1,1)}
    else if(k==='ArrowLeft'){e.preventDefault();goSlide(SS.i-1,-1)}
    else if(k==='t'||k==='T')ssAct('fx');
    else if(k==='m'||k==='M')ssAct('music');
    else if(k==='f'||k==='F')ssAct('fs');
    else if(k==='s'||k==='S')ssAct('style');
    return;
  }
  if(R.el.classList.contains('open')){if(k==='Escape')closeReel();else if(k==='ArrowRight'||k===' '){e.preventDefault();reelNext()}return}
  if(V.el.classList.contains('open')&&!V.el.classList.contains('closing')){
    if(k==='Escape')closeViewer();else if(k==='ArrowRight')show(V.idx+1,1);else if(k==='ArrowLeft')show(V.idx-1,-1);
    else if(k==='p'||k==='P')showFromViewer();
    else if(k==='i'||k==='I')toggleHUD();else if(k==='f'||k==='F')toggleFav();else if(k==='e'||k==='E')toast('Editor · non-destructive, GPU preview · next sub-project');
    else if(k==='Delete')toast(`${fname(FLAT[V.idx])} moved to Recycle Bin`,{label:'Undo',run:()=>toast('Restored')});
    return;
  }
  if(e.target.matches('input,textarea'))return;
  if(k==='/'){e.preventDefault();openPal();return}
  if(k==='Escape'){if(SEL.size)clearSel();else if(document.body.classList.contains('searching'))clearSearch();return}
  if(['1','2','3','4'].includes(k)&&!e.ctrlKey&&!e.altKey){go(VIEWS[+k-1]);return}
  if(view==='library'&&(k==='p'||k==='P')&&!e.ctrlKey&&!e.metaKey){showLibrary();return}
  if(view==='cleanup'){
    if(k==='Enter'){e.preventDefault();nextGroup(true)}else if(k==='s'||k==='S')nextGroup(false);else if(k==='a'||k==='A'){CL.cur.forEach(c=>c.trash=false);nextGroup(false)}
  }
  if(view==='library'&&(e.ctrlKey||e.metaKey)&&k.toLowerCase()==='a'){e.preventDefault();FLAT.forEach(p=>SEL.add(p.id));syncSel()}
});

/* ---------- boot ---------- */
renderLibrary();renderRail();renderAlbums();renderPeople();renderCleanup();icons();
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const k=en.target.id.slice(4);$$('.rail-i').forEach(b=>b.classList.toggle('on',b.dataset.sec===k))}}),{root:lib,rootMargin:'-35% 0px -60% 0px'});
$$('.sec',lib).forEach(s=>io.observe(s));
moveInd();document.fonts?.ready.then(moveInd);onScroll();
</script>
