[package]
name = "sitara"
version = "0.3.0"
description = "Sitara: a fast, private photo and video gallery"
authors = ["Sitara contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/sunderbharath85/sitara"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sitara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
walkdir = "2.5.0"
notify-debouncer-full = "0.7.0"
kamadak-exif = "0.6.1"
imagesize = "0.15.0"
chrono = "0.4.45"
trash = "5.2.9"
dunce = "1.0.5"
rayon = "1.12.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
tokio = { version = "1.54.1", features = ["sync"] }
flate2 = "1.1.10"
blake3 = "1.8.7"
rawler = "0.8.0"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
ureq = "3"
sha2 = "0.10"
tar = "0.4"
regex = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader"] }
# AI on the graphics card: DirectML on Windows, Core ML on macOS (the runtimes themselves download on demand)
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["coreml"] }
